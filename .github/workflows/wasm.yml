name: Build and deploy site WASM

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/out/vcpkg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: out/vcpkg
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: '4.0.23'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Bootstrap vcpkg
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'
      - name: Build
        run: |
          cmake --preset wasm-release
          cmake --build out/build/wasm-release
      - name: Smoke test
        run: node wasm/smoke.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: site-wasm
          path: static/wasm/
          if-no-files-found: error
      - name: Build static site
        run: |
          node wasm/build-pages.mjs
          node wasm/smoke-pages.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: wasm-pages
          path: out/wasm-pages/
          if-no-files-found: error

  pages:
    needs: wasm
    if: >-
      !github.event.repository.fork &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref_type == 'tag')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: wasm-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v7
        with:
          name: wasm-pages
          path: out/wasm-pages
      - name: Select demo path
        id: demo
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) path=. ;;
            refs/heads/develop) path=develop ;;
            refs/tags/*)
              path="${GITHUB_REF#refs/tags/}"
              case "/$path/" in
                /develop/*|/about/*|/contact/*|/contacts/*|/projects/*|/noise/*|/mctools/*|*/static/*|*/index.html/*)
                  echo "::error::Tag conflicts with a reserved Pages path"
                  exit 1
                  ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Save demo alongside other builds
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out/wasm-pages
          destination_dir: ${{ steps.demo.outputs.path }}
          keep_files: true
      # GITHUB_TOKEN pushes don't trigger a branch-based Pages build.
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: published
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
