name: Build site WASM

on:
  pull_request:
  push:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/out/vcpkg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: out/vcpkg
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: '4.0.23'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Bootstrap vcpkg
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'
      - name: Build
        run: |
          cmake --preset wasm-release
          cmake --build out/build/wasm-release
      - name: Smoke test
        run: node wasm/smoke.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: site-wasm
          path: static/wasm/
          if-no-files-found: error
      - name: Prepare deployment
        run: |
          # web-dist target already created build/web-dist/
          # Just copy it to dist/ for GitHub Pages action
          cp -r build/web-dist dist

      - name: Determine deploy path
        id: deploy-path
        if: github.event_name != 'pull_request' && github.event_name != 'release'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "path=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "path=." >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            echo "path=develop" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.event_name != 'release'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.deploy-path.outputs.path }}
          keep_files: true
