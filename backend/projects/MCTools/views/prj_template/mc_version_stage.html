<%c++
    auto para=@@.get<std::unordered_map<std::string, std::string, utils::internal::SafeStringHash>>("parameters");
%>

<div class="wizard-stage hidden" data-stage="2">
    <h2>Версия Minecraft</h2>
    <div class="field">
        <label for="mc-version">Версия Minecraft</label>
        <select id="mc-version" name="minecraft_version" data-populate="minecraft-versions" disabled>
            <option value="">Сначала выберите загрузчик</option>
        </select>
    </div>
    <p id="versionStatus" role="status"></p>

    <div class="field">
        <label for="loader-version">Версия загрузчика</label>
        <select id="loader-version" name="loader_version" data-populate="loader-versions">
            <option value="">Автоматический выбор</option>
        </select>
    </div>
    <label class="choice">
        <input type="checkbox" id="stable-only" checked>
        Только стабильные версии
    </label>
    <p id="loader-version-status" role="status"></p>
</div>
